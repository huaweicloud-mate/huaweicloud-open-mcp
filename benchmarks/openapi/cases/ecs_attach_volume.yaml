id: ecs_attach_volume
prompt: 给云服务器 srv-001 挂载磁盘 vol-001
expect:
  execute:
    - {product: ECS, api: AttachServerVolume}
    - {product: ECS, api: NovaAttachVolume}
  answer: 挂载
  constraints:
    tag_narrowing: true
    max_calls: 10
fixture:
  apis:
    ECS/AttachServerVolume:
      body: {attachable: true}
    ECS/NovaAttachVolume:
      body: {attachment: {id: stub-att-1, volumeId: vol-001}}
labels:
  capability: multi-step
  difficulty: medium
repeat: 2
