[project]
name = "huaweicloud-open-mcp"
version = "0.1.0"
description = "华为云 MCP server：本地 stdio 通用网关（Core 模式），7 个核心工具编排触达华为云全量 OpenAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "jsonschema>=4.10",
    "pyyaml>=6.0.3",
    "tabulate>=0.9.0",
]

[project.scripts]
api-refresh = "apie.refresh:main"
api-docs = "apie.api_docs:main"
huaweicloud-open-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/safety", "src/apie", "src/mcp_openapi", "src/mcp_discover", "src/main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "e2e: 真实数据/凭证端到端测试（默认跳过，用 -m e2e 启用）",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "raw", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "yaml", "tabulate", "mcp.*"]
ignore_missing_imports = true
